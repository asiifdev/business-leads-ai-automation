name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened, description: What did you expect instead?}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Steps to reproduce}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Version or commit}
  - type: textarea
    id: logs
    attributes: {label: Logs (remove secrets and personal data)}
